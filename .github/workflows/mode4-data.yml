name: Mode4 Daily OHLCV
on:
  schedule:
    # 17:10 Asia/Taipei = 09:10 UTC, weekdays. GitHub scheduler can delay.
    - cron: '10 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mode4-market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'yfinance>=0.2.60,<2' 'pandas>=2.1,<3'
      - name: Verify Python syntax before data refresh
        run: python -m py_compile mode4_fetch.py mode4_v41_engine.py
      - run: python mode4_fetch.py
      - name: Run v4.1 deterministic research and paper simulation
        run: python mode4_v41_engine.py
      - name: Verify A/B shadow state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          engine=json.loads(Path('data/mode4_v41_engine.json').read_text())
          state=json.loads(Path('data/mode4_v41_paper.json').read_text())
          assert 'ab_comparison' in engine, 'A/B comparison missing'
          assert 'ab_shadow_accounts' in state, 'A/B accounts missing'
          for version in ('A','B'):
              account=state['ab_shadow_accounts'][version]
              assert account['daily_equity'], version
              dates=[x['date'] for x in account['daily_equity']]
              assert len(dates)==len(set(dates)), f'duplicate valuation dates for {version}'
              ids=[x['event_id'] for x in account['events']]
              assert len(ids)==len(set(ids)), f'duplicate trade events for {version}'
          print('Mode4 A/B shadow validation PASS')
          PY
      - name: Commit latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mode4_latest.json data/mode4_v41_engine.json data/mode4_v41_paper.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m 'data: refresh Mode4 OHLCV and v4.1 paper snapshots'
          git push
